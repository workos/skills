name: Publish MCP server listing
on:
  push:
    branches: [main]
    paths: ["mcp/server.json"]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(jq -r .version server.json)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/com.workos%2Fmcp/versions/$VERSION")
          echo "published=$([ "$CODE" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install mcp-publisher
        if: steps.check.outputs.published == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate (DNS, com.workos namespace)
        if: steps.check.outputs.published == 'false'
        run: ./mcp-publisher login dns --domain workos.com --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"
      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: ./mcp-publisher publish
