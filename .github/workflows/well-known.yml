name: Publish well-known skills

# Attaches the Agent Skills discovery files (index.json plus one .tar.gz per
# skill) to a GitHub release. workos.com serves the latest release's copies at
# /.well-known/agent-skills/, so `npx skills add https://workos.com` works.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to. Files are built from the branch this runs on, so only dispatch it for a release that matches that branch.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: >-
          Socket Firewall auth token used to route public dependency downloads
          through the WorkOS Socket Firewall. Passed explicitly by the caller.
        required: true

jobs:
  publish:
    name: Attach to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build discovery files
        run: npx tsx scripts/build-well-known.ts dist-well-known

      - name: Attach to release
        run: gh release upload "$TAG" dist-well-known/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
