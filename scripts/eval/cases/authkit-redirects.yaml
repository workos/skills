        CORS origin,
        inspect webpack configuration,
      ]
    flowSteps: []
    antiPatterns: ['redirect URI must have no path', 'trailing slashes are forbidden']
    hallucinations: []

- id: authkit-redirect-router-static
  product: authkit
  skill: workos-authkit-react-router
  skillType: hand-crafted
  language: node
  framework: react-router
  prompt: |
    Two React Router apps need AuthKit: one uses createBrowserRouter with browser
    loaders and a static host; the other has react-router.config.ts with
    ssr: false and deploys only build/client. The latter has @react-router/node
    and a build-time root loader. Neither has a request-time server. Do these
    need authLoader server callbacks and WORKOS_API_KEY? Recommend SDKs,
    redirects, and safe initialization without requiring a framework migration.
  expected:
    methods: [AuthKitProvider]
    envVars: []
    imports: ['@workos-inc/authkit-react']
    params: [origin, hydration, inspect deployment, client SDK, origin default, no server callback]
    flowSteps: []
    antiPatterns: ['VITE_WORKOS_API_KEY=', 'REACT_APP_WORKOS_API_KEY=']
    hallucinations: []

- id: authkit-redirect-router-server
  product: authkit
  skill: workos-authkit-react-router
  skillType: hand-crafted
  language: node
  framework: react-router
  prompt: |
    My React Router framework app has registered server routes and a deployed
    Node request handler using @workos-inc/authkit-react-router. configure()
    explicitly sets redirectUri to https://app.example.com/auth/complete while
    WORKOS_REDIRECT_URI still says http://localhost:5173/callback. Show the
    callback loader and explain which full URL must match route registration
    and the WorkOS application settings. Keep secrets on the server.
  expected:
    methods: [authLoader]
    envVars: [WORKOS_REDIRECT_URI]
    imports: ['@workos-inc/authkit-react-router']
    params:
      [
        'https://app.example.com/auth/complete',
        configure,
        programmatic configuration priority,
        register callback route,
        match registration,
        server-only secrets,
      ]
    flowSteps: []
    antiPatterns: ['VITE_WORKOS_API_KEY=']
    hallucinations: []

