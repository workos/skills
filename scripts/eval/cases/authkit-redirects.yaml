- id: authkit-redirect-registration-vs-reachability
  product: authkit
  skill: workos-authkit-setup
  skillType: hand-crafted
  language: node
  framework: react
  prompt: |
    Review these SPA settings without modifying anything. The SDK explicitly
    receives https://auth.example.com/auth/complete/ but the registered URL has
    no trailing slash. A second registered URL /missing returns 404; no provider
    runs there. CORS contains the full /auth/complete/ URL instead of an origin.
    Locally the app runs on port 5173 but registration is for port 3000. Explain
    why parseable URLs and grep hits are insufficient, what to compare, and how
    to preserve existing entries, Sign-out URI, and separate Initiate login URI.
    Do not ban all custom paths or normalize settings silently.
  expected:
    methods: []
    envVars: []
    imports: []
    params: [Sign-out URI, Initiate login URI, 'https://auth.example.com']
    unorderedRequirements:
      - anyOf: [compare effective redirect, compare configured redirect registration]
        noneOf: [silently normalize trailing slashes]
      - anyOf: [verify destination, check destination, confirm SDK initializes destination]
        noneOf: [404 acceptable, missing provider acceptable, parsing proves destination]
      - anyOf: [separate CORS origin, register origin separately CORS, CORS uses app origin]
        noneOf: [CORS full URL, CORS callback path]
      - anyOf: [preserve existing entries, retain current registrations, keep existing URLs]
        noneOf: [replace entire list without reading]
      - anyOf: [confirm environment, verify target environment, check intended environment]
    flowSteps: []
    antiPatterns: ['redirect URI must have no path', 'trailing slashes are forbidden']
    hallucinations: []
