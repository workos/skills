# Future model evaluations only. Offline tests load these; they do not run a model.
# Independent setup requirements accept case-authored alternative wording within a clause.
# Each anyOf group is one requirement; noneOf lists contradictory advice (not extra requirements).
# flowSteps is reserved for causal runtime sequences, not the order of an explanation.
- id: authkit-redirect-vite-origin
  product: authkit
  skill: workos-authkit-react
  skillType: hand-crafted
  language: node
  framework: react
  prompt: |
    Add AuthKit to my Vite React SPA at http://localhost:5173. package.json has
    vite and react-router-dom; main.tsx renders BrowserRouter on a static host.
    There is no server. Show the provider/env setup and application URL settings.
    Should I create /callback? I also need sign-out and externally initiated login.
  expected:
    methods: [AuthKitProvider]
    envVars: [VITE_WORKOS_CLIENT_ID]
    imports: ['@workos-inc/authkit-react']
    params: [http://localhost:5173, Sign-out URI, Initiate login URI]
    unorderedRequirements:
      - anyOf: [origin default, default app origin]
      - anyOf: [register redirect, add redirect URI, allowlist redirect URL]
      - anyOf: [allowed origins, CORS origin, allow app origin]
        noneOf: [CORS full URL, CORS callback path]
      - anyOf: [separate login route, dedicated login route, separate sign in route]
        noneOf: [callback as Initiate login]
    flowSteps: []
    antiPatterns:
      [
        'VITE_WORKOS_API_KEY=',
        'VITE_WORKOS_COOKIE_PASSWORD=',
        'VITE_WORKOS_REDIRECT_URI=http://localhost:5173/callback',
      ]
    hallucinations: []

- id: authkit-redirect-cra-custom
  product: authkit
  skill: workos-authkit-react
  skillType: hand-crafted
  language: node
  framework: react
  prompt: |
    This is a CRA app (react-scripts), not Vite. It is hosted at
    https://auth.example.com with a deliberate /auth/complete SPA route. The
    static host serves the app there and the AuthKitProvider wraps the entire
    app, including that route. The only env values are REACT_APP_WORKOS_CLIENT_ID
    and REACT_APP_WORKOS_REDIRECT_URI=https://auth.example.com/auth/complete.
    Existing code only passes clientId to AuthKitProvider. Wire the intended
    custom redirect and explain what to register and verify without deleting
    the path or requiring a server migration.
  expected:
    methods: [AuthKitProvider]
    envVars: [REACT_APP_WORKOS_CLIENT_ID, REACT_APP_WORKOS_REDIRECT_URI]
    imports: ['@workos-inc/authkit-react']
    params: [redirectUri, 'process.env.REACT_APP_WORKOS_REDIRECT_URI', 'https://auth.example.com/auth/complete']
    unorderedRequirements:
      - anyOf: [pass redirectUri, supply redirectUri, forward redirectUri]
        noneOf: [env automatically configures SDK]
      - anyOf: [register full URL, allowlist entire redirect URL, register complete redirect address]
        # Keep "use origin" alternatives redirect-qualified: CORS correctly uses an origin.
        noneOf:
          [
            register only origin,
            register just origin,
            allowlist only origin,
            use just origin redirect,
            use only origin redirect,
            use origin alone redirect,
          ]
      - anyOf: [CORS origin, allowed origins, allow app origin]
        noneOf: [CORS full URL, CORS callback path]
      - anyOf: [verify destination, check destination, confirm SDK initializes destination]
        noneOf: [404 acceptable, missing provider acceptable, parsing proves destination]
    flowSteps: []
    antiPatterns: ['redirect URI must have no path', 'REACT_APP_WORKOS_API_KEY=']
    hallucinations: []

