    http://localhost:5173 using the documented default and (b) an intentional
    https://app.example.com/auth/complete/ destination that serves our app and
    initializes the SDK. That trailing-slash URL is registered exactly. Explain
    how the optional redirect is consumed and what CORS value is needed. Our
