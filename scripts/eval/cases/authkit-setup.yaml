- id: management-dashboard-auth-and-json
  product: management
  skill: workos-management
  skillType: hand-crafted
  language: node
  prompt: |
    WORKOS_API_KEY is set but workos config redirect add returns auth_required.
    I also need to script organization creation and extract the ID. My CLI
    returns {"organization":{"id":"org_123"}}. Explain how to authenticate,
    avoid targeting production, and extract the ID from that response.
  expected:
    methods:
      - workos auth login
      - workos whoami
    envVars: []
    imports: []
    params:
      - --environment-id
      - .organization.id
    flowSteps:
      - dashboard login
      - confirm environment
      - organization create
    antiPatterns: []
    hallucinations: []
