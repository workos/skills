- id: mcp-codex-startup-interrupted
  product: mcp
  skill: workos-mcp
  skillType: generated
  prompt: |
    My Codex session printed "MCP startup interrupted. The following servers
    were not initialized: workos". The server is defined in this repo's
    .codex/config.toml. How do I get the WorkOS MCP tools working again?
  expected:
    methods: []
    envVars: []
    imports: []
    params: []
    flowSteps:
      - codex mcp get workos
      - project trust
      - codex mcp login workos
      - host shell browser
      - codex mcp list
      - restart Codex
    antiPatterns:
      - delete .codex/config.toml
      - conclude the WorkOS server is down
      - copy the OAuth token
      - retry the login from the sandbox
    hallucinations:
      - codex mcp restart
      - codex mcp enable
      - codex mcp reconnect
      - workos mcp doctor

- id: mcp-setup-client-scope
  product: mcp
  skill: workos-mcp
  skillType: generated
  prompt: |
    I want to connect the WorkOS MCP server so my agent can manage my workspace.
    I use Claude Code on this machine, and the workos CLI is already installed
    and authenticated. Set it up, and tell me whether this lands in my
    user-global config or only in this repo.
  expected:
    methods: []
    envVars: []
    imports: []
    params: []
    flowSteps:
      - workos.com/docs/mcp
      - workos mcp install
      - mcp.workos.com/mcp
      - user scope account-level
      - host shell browser
      - workos mcp status
    antiPatterns:
      - claude_desktop_config.json
      - stdio
      - WORKOS_API_KEY
      - print the OAuth token
    hallucinations:
      - workos mcp connect
      - claude mcp auth
      - ~/.config/Claude
      - Application Support/Claude

- id: mcp-management-cli-no-mcp
  product: mcp
  skill: workos-mcp
  skillType: generated
  prompt: |
    I need to create a new organization in my WorkOS workspace from this
    terminal session. I have the workos CLI installed and authenticated, and
    I've intentionally not configured any MCP servers for this project.
    What's the fastest way to do this?
  expected:
    methods: []
    envVars: []
    imports: []
    params: []
    flowSteps:
      - workos organization create
    antiPatterns:
      - codex mcp add workos
      - workos mcp install
      - set up the MCP server first
      - mcp.workos.com
    hallucinations:
      - workos organizations create
      - workos org create
      - workos create organization
